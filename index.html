<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#e7d0a4">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Khun Phaen">
  <meta name="description" content="Slide the wooden blocks and help Khun Phaen escape through the sunny gap.">
  <title>Khun Phaen</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/favicon-32.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
</head>
<body>
  <div class="game">
    <h1 class="sr-only">Khun Phaen</h1>
    <header class="hud">
      <div class="score-row">
        <p class="moves" aria-live="polite">
          <span class="sr-only">Moves</span>
          <span id="move-count" class="move-count">0</span>
        </p>
        <p class="used-hints" id="used-hints" aria-label="Hints used">
          <svg class="bulb" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M9 21h6M10 18h4"/>
            <path d="M12 2a7 7 0 0 0-4 12.4c.6.7 1 1.4 1 2.1h6c0-.7.4-1.4 1-2.1A7 7 0 0 0 12 2z"/>
          </svg>
          <span id="hint-count">0</span>
        </p>
      </div>
      <div class="bests">
        <p class="best" id="best" aria-label="Best score without hints">
          <svg class="star" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 3.2 14.7 9l6.3.6-4.8 4.1 1.5 6.1L12 16.8 6.3 19.8 7.8 13.7 3 9.6 9.3 9z"/>
          </svg>
          <span id="best-count">–</span>
        </p>
        <p class="best hint-best" id="hint-best" aria-label="Best score with hints">
          <svg class="bulb" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M9 21h6M10 18h4"/>
            <path d="M12 2a7 7 0 0 0-4 12.4c.6.7 1 1.4 1 2.1h6c0-.7.4-1.4 1-2.1A7 7 0 0 0 12 2z"/>
          </svg>
          <span id="hint-best-count">–</span>
        </p>
      </div>
    </header>

    <div class="stage">
      <div class="tray" id="tray">
        <div class="wood top"></div>
        <div class="wood side left"></div>
        <div class="board" id="board"></div>
        <div class="wood side right"></div>
        <div class="wood bot bot-left"></div>
        <div class="gap" aria-hidden="true">
          <i class="ray"></i>
          <i class="ray"></i>
          <i class="ray"></i>
          <div class="sun"></div>
        </div>
        <div class="wood bot bot-right"></div>
      </div>
    </div>

    <footer class="controls">
      <button type="button" id="undo" aria-label="Undo" disabled>
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M9 14 4 9l5-5"/>
          <path d="M4 9h10.5a5.5 5.5 0 1 1 0 11H12"/>
        </svg>
      </button>
      <button type="button" id="restart" aria-label="Restart">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M19 12a7 7 0 1 1-2-4.9"/>
          <path d="M19 4.5V9h-4.5"/>
        </svg>
      </button>
      <button type="button" id="hint" aria-label="Hint">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M9 21h6M10 18h4"/>
          <path d="M12 2a7 7 0 0 0-4 12.4c.6.7 1 1.4 1 2.1h6c0-.7.4-1.4 1-2.1A7 7 0 0 0 12 2z"/>
        </svg>
      </button>
      <button type="button" id="sound" aria-pressed="false" aria-label="Sound off">
        <svg class="icon-off" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 10h3.2L12 6.2v11.6L7.2 14H4z"/>
          <path d="M16 9.5 20.5 14M20.5 9.5 16 14"/>
        </svg>
        <svg class="icon-on" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 10h3.2L12 6.2v11.6L7.2 14H4z"/>
          <path d="M15.2 9.2a3.6 3.6 0 0 1 0 5.6"/>
          <path d="M17.6 7a6.4 6.4 0 0 1 0 10"/>
        </svg>
      </button>
    </footer>

    <div class="win" id="win" hidden>
      <div class="confetti" id="confetti"></div>
      <div class="win-card">
        <svg class="win-crown" viewBox="0 0 64 36" aria-hidden="true">
          <path d="M4 30 10 12l14 10L32 6l8 16 14-10 6 18z"/>
          <circle cx="10" cy="12" r="3"/>
          <circle cx="32" cy="7" r="3"/>
          <circle cx="54" cy="12" r="3"/>
        </svg>
        <p class="win-num" id="win-num">0</p>
        <p class="win-star" id="win-star" hidden>★</p>
        <p class="win-bulb" id="win-bulb" hidden>💡</p>
        <button type="button" id="again">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M19 12a7 7 0 1 1-2-4.9"/>
            <path d="M19 4.5V9h-4.5"/>
          </svg>
          <span>Again</span>
        </button>
      </div>
    </div>
  </div>
  <script type="module" src="js/game.js"></script>
</body>
</html>
